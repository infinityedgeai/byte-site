name: CI & Deploy — Dev

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]   # PRs just run CI; deploy only happens on push to develop
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME:    # dev app (same as your current)
  SLOT_NAME: 
  NODE_VERSION: 22.17.1

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (CI)
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: 🌱 Checkout
        uses: actions/checkout@v4

      - name: 🍏 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ⚙️ Install & Build
        run: |
          cd ./src
          echo "NEXT_PUBLIC_URL=${{ vars.NEXT_PUBLIC_URL }}" > .env
          cat .env
          npm ci
          npm run build --if-present
          cd ..

      - name: 📂 Copy standalone into root
        run: cp -R ./src/.next/standalone ./site-deploy

      - name: 📂 Copy static into .next
        run: cp -R ./src/.next/static ./site-deploy/.next/static

      - name: 📂 Copy public
        run: cp -R ./src/public ./site-deploy/public

      - name: 📦 Zip package
        run: |
          cd ./site-deploy
          zip Nextjs-site.zip ./* .next -qr
          mv Nextjs-site.zip $GITHUB_WORKSPACE/

      - name: 🔍 Diagnostics
        run: |
          ls -la ./src
          ls -la ./src/.next
          ls -la ./site-deploy
          ls -la $GITHUB_WORKSPACE

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nextjs-site
          path: ${{ github.workspace }}/Nextjs-site.zip

  deploy:
    name: Deploy to Azure (Dev)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop')
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Nextjs-site

      - name: 🚀 Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.SLOT_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/Nextjs-site.zip
