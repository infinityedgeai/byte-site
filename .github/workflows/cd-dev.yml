name: CD Pipeline — Dev
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'byte-dev-c5cdcxfpd9bch6dp'
  NODE_VERSION: 22.17.1

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Azure (Dev)
    # Only deploy if CI succeeded and the branch is 'dev'
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-latest
    environment:
      name: Development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Nextjs-site
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/Nextjs-site.zip