name: Dev Deploy Pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'byte'
  SLOT_NAME: 'dev'
  NODE_VERSION: $ {{ vars.NODE_VERSION }}

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Azure (Dev)
    # Only deploy if CI succeeded and the branch is 'dev'
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-latest
    environment:
      name: Development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Nextjs-site
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.SLOT_NAME }}
          publish-profile: ${{ secrets.DEV_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/Nextjs-site.zip
