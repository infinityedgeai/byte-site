name: CD Pipeline — Prod

on:
  # only deploy to prod manually
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: byte'
  NODE_VERSION: ${{ vars.NODE_VERSION }}

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false   # don't cancel prod deploys mid-flight

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy to Azure (Prod)
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: Production   # use env protection for approvals if you like
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Nextjs-site

      - name: 🚀 Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/Nextjs-site.zip
