name: CD Pipeline — Prod

on:
  # Deploy after PRs are merged into release/main (push happens on merge)
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: byte-g3gxd3egf7asg3dg'
  NODE_VERSION: 22.17.1

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false   # don't cancel prod deploys mid-flight

jobs:
  build:
    name: Build (CI)
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: 🌱 Checkout
        uses: actions/checkout@v4

      - name: 🍏 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ⚙️ Install & Build
        run: |
          cd ./src
          echo "NEXT_PUBLIC_URL=${{ vars.NEXT_PUBLIC_URL }}" > .env
          cat .env
          npm ci
          npm run build --if-present
          cd ..

      - name: 📂 Copy standalone into root
        run: cp -R .next/standalone ./site-deploy

      - name: 📂 Copy static into .next
        run: cp -R .next/static ./site-deploy/.next/static

      - name: 📂 Copy public
        run: cp -R public ./site-deploy/public

      - name: 📦 Zip package
        run: |
          cd ./site-deploy
          zip Nextjs-site.zip ./* .next -qr
          mv Nextjs-site.zip $GITHUB_WORKSPACE/

      - name: 🔍 Diagnostics
        run: |
          ls -la ./src
          ls -la ./src/.next
          ls -la ./site-deploy
          ls -la $GITHUB_WORKSPACE

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nextjs-site
          path: ${{ github.workspace }}/Nextjs-site.zip

  deploy:
    name: Deploy to Azure (Prod)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production   # use env protection for approvals if you like
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Nextjs-site

      - name: 🚀 Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/Nextjs-site.zip
