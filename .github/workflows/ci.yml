name: Build & Test Pipeline
on:
  push:
    branches: [dev]
  pull_request:
  
jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }} 
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Run unit tests (Jest)
        run: npm test

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: unit-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
      # currently not saving logs as not needed yet. uncomment to start saving logs
      # - name: Upload Cypress test results
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: cypress-results
      #     path: cypress/results
  
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: e2e-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build
        working-directory: ./src
      - name: 📂 Copy standalone into root
        run: cp -R ./src/next/standalone ./site-deploy

      - name: 📂 Copy static into .next
        run: cp -R ./src/next/static ./site-deploy/.next/static

      - name: 📂 Copy public
        run: cp -R /src/public ./site-deploy/public

      - name: 📦 Zip package
        run: |
          cd ./site-deploy
          zip site.zip ./* .next -qr
          mv site.zip $GITHUB_WORKSPACE/

      - name: 🔍 Diagnostics
        run: |
          ls -la ./src
          ls -la ./src/.next
          ls -la ./site-deploy
          ls -la $GITHUB_WORKSPACE

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ github.workspace }}/site.zip
